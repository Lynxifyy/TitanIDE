name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the old run. Saves CI minutes on a busy PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  # ---------------------------------------------------------------------------
  # Fast gates first. These are cheap and catch the mistakes that would make the
  # expensive Android jobs pointless: a leaked secret, a tracked artifact. Keeping
  # them in their own job means a PR goes red in about 30 seconds.
  # ---------------------------------------------------------------------------
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked build artifacts and local config
        run: |
          status=0
          if git ls-files | grep -E '(^|/)local\.properties$'; then
            echo "::error::local.properties is tracked; it holds the machine-specific SDK path"
            status=1
          fi
          if git ls-files | grep -E '\.(jks|keystore)$' | grep -v debug; then
            echo "::error::a signing keystore is tracked; ignore it and pass it as a secret"
            status=1
          fi
          if git ls-files | grep -E '\.(apk|aab)$'; then
            echo "::error::a build artifact is tracked; artifacts belong in releases"
            status=1
          fi
          exit $status

      - name: Reject credential-shaped literals in source
        run: |
          # The length bounds keep obvious placeholders out of the way while still
          # catching a real token pasted into a source file.
          if grep -rInE '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{32,})' \
               --include='*.kt' --include='*.kts' --include='*.py' --include='*.xml' \
               --include='*.json' --include='*.yml' --include='*.yaml' \
               --exclude-dir=build --exclude-dir=.git . ; then
            echo "::error::a credential-shaped literal is committed above"
            exit 1
          fi
          echo "No credential-shaped literals found."

  agent-tests:
    name: Build agent tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run agent tests
        working-directory: backend/agent
        # No third-party dependencies by design: the agent is stdlib only, so there
        # is nothing to install and no supply chain to verify.
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    needs: [repo-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        # The ubuntu runner ships the SDK and sdkmanager on PATH. The
        # android-actions/setup-android action is avoided on purpose: its
        # license step runs `sdkmanager --licenses`, which prompts for input and
        # dies in a non-interactive job. Accepting the licenses with a piped
        # "yes" is what actually works here.
        run: |
          set -eu
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Lint
        # Lint reports zero errors on this tree; it fails the job if that changes.
        # Version-update warnings are expected and do not fail.
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
